name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: |
          mkdir -p www
          echo '<!doctype html><title>BrightSteps</title>' > www/index.html
      - run: npx cap add android
      - name: Make icon and splash from logo
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          mkdir -p assets
          convert app_logo_8k.png -resize 1024x1024 -background none -gravity center -extent 1024x1024 assets/icon-only.png
          convert app_logo_8k.png -resize 680x680 -background none -gravity center -extent 1024x1024 assets/icon-foreground.png
          convert -size 1024x1024 xc:white assets/icon-background.png
          convert app_logo_8k.png -resize 900x900 -background white -gravity center -extent 2732x2732 assets/splash.png
          cp assets/splash.png assets/splash-dark.png
          npx --yes @capacitor/assets@3.0.5 generate --android
      - run: npx cap sync android
      - working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: BrightSteps-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
